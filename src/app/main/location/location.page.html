<ion-header>
  <ion-toolbar>
    <ion-title  class="ion-text-center">Location</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content>
  <div class="map" #map></div>
  <ion-grid>
    <div *ngFor="let location of storeLocations">
      <ion-row>
        <ion-col size=12 class="ion-text-center">
         <ion-item>
           <ion-label>{{ location.title }}</ion-label>
         </ion-item>
        </ion-col>
      </ion-row>
      <ion-row>
        <ion-col size="5" offset="1">
          {{ location.street }}
        </ion-col>
        <ion-col size="2">
          {{ location.city }}
        </ion-col>
        <ion-col size="2">
          {{ location.state }}
        </ion-col>
        <ion-col size="2">
          {{ location.zip }}
        </ion-col>
      </ion-row>
    </div>
  </ion-grid>
</ion-content>
