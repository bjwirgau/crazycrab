<ion-header>
  <ion-toolbar>
    <ion-title  class="ion-text-center">Location</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content>
  <div class="map" #map></div>
  <ion-grid class="container">
    <div *ngFor="let location of storeLocations">
      <ion-row>
        <ion-col size=12>
         <ion-item lines="none">
           <ion-label class="ion-text-center">{{ location.title }}</ion-label>
         </ion-item>
        </ion-col>
      </ion-row>
      <ion-row>
        <ion-col size="5" offset="1">
          {{ location.street }}
        </ion-col>
        <ion-col size="3">
          {{ location.city }}
        </ion-col>
        <ion-col size="1">
          {{ location.state }}
        </ion-col>
        <ion-col size="2">
          {{ location.zip }}
        </ion-col>
      </ion-row>
      <div ngFor="let location of storeLocations">
        <ion-row >
          <ion-col size="1" offset="1">
            <ion-icon name="add-circle-outline"></ion-icon>
          </ion-col>
          <ion-col size="10">
            <ion-item>
              <ion-label [id]="'expand-'+location.id">Store Hours</ion-label>            
            </ion-item>
          </ion-col>
        </ion-row>
        <ion-row *ngFor="let day of location.hours" class="section collapsible collapsed">
          <ion-col size="4">{{ day['day'] }}</ion-col>
          <ion-col size="4">{{ day['from']+'-'+day['to'] }}</ion-col>
        </ion-row>
      </div>
      <ion-row *ngIf="!location.open">
        <ion-col>
          <ion-item lines="none">
            <ion-label class="ion-text-center">Coming Soon</ion-label>
          </ion-item>
        </ion-col>
      </ion-row>
    </div>
  </ion-grid>
</ion-content>
