<ion-header>
  <ion-toolbar color="primary">
    <ion-title class="ion-text-center">Account</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <form #f="ngForm" (ngSubmit)="onSubmit(f)">
    <ion-grid>
      <ion-row>
        <ion-col size-sm="6" offset-sm="3">
          <ion-list>
            <ion-item>
              <ion-label position="floating">E-Mail</ion-label>
              <ion-input class="username" type="email" ngModel name="email" required email #emailCtrl="ngModel"></ion-input>
            </ion-item>
            <ion-item *ngIf="!emailCtrl.valid && emailCtrl.touched" lines="none">
              <ion-label>
                Should be a valid email address.
              </ion-label>
            </ion-item>
            <ion-item>
              <ion-label position="floating">Password</ion-label>
              <ion-input type="password" ngModel name="password" required minlength="6" #passwordCtrl="ngModel"></ion-input>
            </ion-item>
            <ion-item *ngIf="!passwordCtrl.valid && passwordCtrl.touched" lines="none">
              <ion-label>
                Should at least be 6 characters long.
              </ion-label>
            </ion-item>
          </ion-list>
        </ion-col>
      </ion-row>
      <ion-row>
        <ion-col size="12">
          <ion-button
            type="submit"
            color="primary"
            expand="full"
            [disabled]="!f.valid"
          >
            Login
          </ion-button>
          <ion-button 
          type="button" 
          color="primary" 
          fill="outline" 
          expand="full"
          routerLink="/main/tabs/account/signup">
            Sign Up
          </ion-button>
        </ion-col>
      </ion-row>
      <ion-row>
        <ion-col size="6" offset="3" class="ion-text-center">
          <ion-list>
            <a routerLink="/main/tabs/account/forgotpassword">Forgot Password?</a>
          </ion-list>
        </ion-col>
      </ion-row>
    </ion-grid>
  </form>
</ion-content>
