<ion-grid class="store-entry">
  <ion-row>
    <ion-col size="1">
      <ion-item class="form-field">
        <ion-label position="floating">
          Id
        </ion-label>
        <ion-input type="text" placeholder="Awesome Input" [value]="store.storeId" disabled></ion-input>
      </ion-item>
    </ion-col>
    <ion-col size="3">
      <ion-item class="form-field">
        <ion-label position="floating">
          Title
        </ion-label>
        <ion-input type="text" [value]="store.title"></ion-input>
      </ion-item>
    </ion-col>
    <ion-col size="8">
      <ion-item class="form-field">
        <ion-label position="floating">
          Street
        </ion-label>
        <ion-input type="text" [value]="store.street"></ion-input>
      </ion-item>
    </ion-col>
    <ion-col size="2">
      <ion-item class="form-field">
        <ion-label position="floating">
          City
        </ion-label>
        <ion-input type="text" [value]="store.city"></ion-input>
      </ion-item>
    </ion-col>
    <ion-col size="2">
      <ion-item class="form-field">
        <ion-label position="floating">
          State
        </ion-label>
        <ion-input type="text" [value]="store.state"></ion-input>
      </ion-item>
    </ion-col>
    <ion-col size="2">
      <ion-item class="form-field">
        <ion-label position="floating">
          Zip
        </ion-label>
        <ion-input type="text" [value]="store.zip"></ion-input>
      </ion-item>
    </ion-col>
    <ion-col size="3">
      <ion-item class="form-field">
        <ion-label position="floating">
          Phone
        </ion-label>
        <ion-input type="text" [value]="store.phonenumber"></ion-input>
      </ion-item>
    </ion-col>
  </ion-row>
</ion-grid>
