<ion-header>
  <ion-toolbar>
    <ion-title>Users</ion-title>
    <ion-buttons slot="start">
      <ion-menu-button></ion-menu-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content>
  <ion-grid class="ion-grid">
    <ion-row class="grid-header">
      <ion-col size="3" class="grid-column-header">
        <div class="column-title">
          First Name
        </div>
      </ion-col>
      <ion-col size="3" class="grid-column-header">
        <div class="column-title">
          Last Name
        </div>
      </ion-col>
      <ion-col size="3" class="grid-column-header">
        <div class="column-title">
          Email
        </div>
      </ion-col>
      <ion-col size="1" class="grid-column-header">
        <div class="column-title">
          Admin
        </div>
      </ion-col>
    </ion-row>
    <ion-row *ngFor="let user of loadedUsers" class="row-entry">
      <ion-col size="3" class="grid-cell">
        {{ user.firstname }}
      </ion-col>
      <ion-col size="3" class="grid-cell">
        {{ user.lastname }}
      </ion-col>
      <ion-col size="3" class="grid-cell">
        {{ user.email }}
      </ion-col>
      <ion-col size="1" class="grid-cell">
        {{ user.isAdmin ? 'Yes' : 'No' }}
      </ion-col>
    </ion-row>
  </ion-grid>
</ion-content>
