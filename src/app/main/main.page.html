<ion-content class="main-background" >
  <ion-tabs>
    <ion-tab-bar slot="bottom">
      <ion-tab-button tab="menu">
        <ion-label>Menu</ion-label>
        <ion-icon name="restaurant"></ion-icon>
      </ion-tab-button>
      <ion-tab-button tab="account">
        <ion-label>Account</ion-label>
        <ion-icon name="person"></ion-icon>
      </ion-tab-button>
      <ion-tab-button tab="rewards">
        <ion-label>Rewards</ion-label>
        <ion-icon name="medal"></ion-icon>
      </ion-tab-button>
      <ion-tab-button tab="location">
        <ion-label>Location</ion-label>
        <ion-icon name="map"></ion-icon>
      </ion-tab-button>
      <ion-tab-button id="cart-tab" tab="cart">
        <ion-label>Cart</ion-label>
        <ion-icon name="cart"></ion-icon>
        <ion-badge color="secondary" *ngIf="count > 0">{{ count }}</ion-badge>
      </ion-tab-button>      
    </ion-tab-bar>
  </ion-tabs>
</ion-content>
