<ion-header>
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button color="secondary" defaultHref="/main/tabs/menu/chooseyourown/pickyoursauce"></ion-back-button>
    </ion-buttons>
    <ion-title class="ion-text-center">Pick Your Spicy</ion-title>
  </ion-toolbar>
</ion-header>
  
<ion-content>
  <ion-grid>
    <ion-row>
      <ion-col>
        <ion-button expand="block" color="primary" (click)="reviewYourSeafood()">Mild</ion-button>
      </ion-col>
    </ion-row>
    <ion-row>
      <ion-col>
        <ion-button expand="block" color="primary" (click)="reviewYourSeafood()">Medium</ion-button>
      </ion-col>
    </ion-row>
    <ion-row>
      <ion-col>
        <ion-button expand="block" color="primary" (click)="reviewYourSeafood()">Hot</ion-button>
      </ion-col>
    </ion-row>
    <ion-row>
      <ion-col>
        <ion-button expand="block" color="primary" (click)="reviewYourSeafood()">Extra Hot</ion-button>
      </ion-col>
    </ion-row>
  </ion-grid>
</ion-content>
