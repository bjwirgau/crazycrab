<ion-header>
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button color="secondary" defaultHref="/main/tabs/menu/chooseyourown/pickyourspicy"></ion-back-button>
    </ion-buttons>
    <ion-title class="ion-text-center">Review Your Seafood</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content>
  <div *ngIf="currentSeafood.length <= 0">
    The poachers stole you seafood! Try again!
  </div>
  <div *ngIf="currentSeafood.length > 0">
    <ion-grid>
      <ion-row *ngFor="let seafood of currentSeafood">
        <ion-col size="3">
          <ion-img [src]="seafood.imageUrl"></ion-img>
        </ion-col>
        <ion-col size="6">
          <ion-grid class="ion-no-padding">
            <ion-row>
              <ion-col>
                {{ seafood.name }}
              </ion-col>
            </ion-row>
            <ion-row>
              <ion-col>
                {{ seafood.price | currency }} / pound
              </ion-col>
            </ion-row>
            <ion-row>
              <ion-col>
                {{ seafood.flavor }}
              </ion-col>
            </ion-row>
            <ion-row>
              <ion-col>
                {{ seafood.spicyLevel }}
              </ion-col>
            </ion-row>
          </ion-grid>
        </ion-col>
        <ion-col size="3">
          <p class="subtotal">
              {{ seafood.subtotal | currency }}
          </p>
        </ion-col>
      </ion-row>
    </ion-grid>
    <ion-item-divider color="primary">
        <ion-label>
          Totals Review
        </ion-label>
      </ion-item-divider>
      <ion-grid>
        <ion-row>
          <ion-col class="ion-text-right">
            Subtotal
          </ion-col>
          <ion-col size="3" class="ion-text-right">
            {{ chooseYourOwnSubtotal | currency }}
          </ion-col>
        </ion-row>
        <ion-row class="ion-justify-content-center ion-align-items-center" style="height: 100%">
            <ion-col class="ion-text-center ion-no-padding">
              <ion-label *ngIf="complete" color="success">Added to Cart</ion-label>
            </ion-col>
          </ion-row>
        <ion-row>
          <ion-col>
            <ion-button type="button" color="secondary" expand="block" (click)="addSeafoodToCart(currentSeafood)">Add Seafood To Cart</ion-button>
          </ion-col>
        </ion-row>
      </ion-grid>
  </div>
</ion-content>
