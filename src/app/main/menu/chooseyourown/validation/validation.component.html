<ion-header>
  <ion-toolbar>
    <ion-title>Woops!</ion-title>
    <ion-buttons slot="primary">
      <ion-button (click)="onCancel()">
        <ion-icon color="secondary" name="close"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-text-center" padding>
  <p>Please choose at least one option before choosing your sauce.</p>
  <ion-grid>
    <ion-row>
      <ion-col size-sm="6" offset-sm="3">
        <ion-button
          color="primary"
          expand="block"
          (click)="onCancel()"
        >
          Okay!
        </ion-button>
      </ion-col>
    </ion-row>
  </ion-grid>
</ion-content>
