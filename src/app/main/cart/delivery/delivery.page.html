<ion-header>
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button color="secondary" defaultHref="/main/tabs/menu/cart"></ion-back-button>
    </ion-buttons>
    <ion-title class="ion-text-center">Delivery Options</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content>
  <ion-grid>
    <ion-radio-group value="devivery-methods" name="delivery-methods" #deliveryMethods (ionChange)="onDeliveryMethodChange($event)">
      <ion-row>
        <ion-col size="12">
          <ion-item>
            <ion-label> Pickup </ion-label>
            <ion-radio slot="start" name="pickup" value="pickup"></ion-radio>
          </ion-item>
          <ion-item>
            <ion-label> No Contact Pickup </ion-label>
            <ion-radio slot="start" name="no-contact-pickup" value="no-contact-pickup"></ion-radio>
          </ion-item>
        </ion-col>
      </ion-row>
    </ion-radio-group>
    <ion-row>
      <ion-col size="10" offset="1">
        <ion-button type="button" expand="block" (click)="saveDeliveryMethod($event)">Payment</ion-button>
      </ion-col>
    </ion-row>
  </ion-grid>
</ion-content>
