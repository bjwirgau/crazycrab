<ion-header>
  <ion-toolbar>
    <ion-title class="ion-text-center">Account Details</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content>
  <ion-list *ngFor="let accountDetails of loadedAccountDetails">
    <ion-list-header lines="inset">
      <ion-label>General</ion-label>
    </ion-list-header>
    <ion-item >
      <ion-label position="floating">Email</ion-label>
      <ion-input disabled [value]="accountDetails.email"></ion-input>
    </ion-item>
    <ion-item >
      <ion-label position="floating">First Name:</ion-label>
      <ion-input disabled [value]="accountDetails.firstname"></ion-input>
    </ion-item>
    <ion-item >
      <ion-label position="floating">Last Name:</ion-label>
      <ion-input disabled [value]="accountDetails.lastname"></ion-input>
    </ion-item>
  </ion-list>

  <ion-grid>
    <ion-row>
      <ion-col size-sm="6" offset-sm="3">
        <ion-button
          type="button"
          color="primary"
          expand="block"
          (click)="logout()"
        >
          Sign Out
        </ion-button>
      </ion-col>
    </ion-row>
  </ion-grid>
</ion-content>
