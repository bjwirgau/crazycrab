<ion-header>
  <ion-toolbar color="primary">
    <ion-title  class="ion-text-center">Location</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content>
  <div class="map" #map></div>
  <ion-card (click)="expandItem(location, $event)" *ngFor="let location of storeLocations">
    <ion-card-header>
      <ion-card-title class="ion-text-center">{{location.title}}</ion-card-title>
    </ion-card-header>

    <ion-card-content>
      <app-expandable expandHeight="260px" [expanded]="location.expanded">
        <ion-row>
          <ion-col size="5" offset="1">
            {{ location.street }}<br>
            {{ location.city }}, {{ location.state }} {{ location.zip }}<br>
          </ion-col>
          <ion-col size="6">
            <ion-button id="directions"type="button" color="secondary" expand="block" size="small">Directions</ion-button>
          </ion-col>
        </ion-row>
        <div ngFor="let location of storeLocations">
          <ion-row >
            <ion-col size="12">
              <ion-item>
                <ion-label [id]="'expand-'+location.id">Store Hours</ion-label>            
              </ion-item>
            </ion-col>
          </ion-row>
          <ion-row *ngFor="let day of location.hours" class="section collapsible collapsed">
            <ion-col offset="1" size="4">{{ day['day'] }}</ion-col>
            <ion-col offset="1" size="6"><div class="ion-text-right">{{ getFormattedTime(day['from'])+' - '+getFormattedTime(day['to']) }}</div></ion-col>
          </ion-row>
        </div>
        <ion-row *ngIf="!location.open">
          <ion-col>
            <ion-item lines="none">
              <ion-label class="ion-text-center">Coming Soon</ion-label>
            </ion-item>
          </ion-col>
        </ion-row>
      </app-expandable>
    </ion-card-content>
  </ion-card>
</ion-content>
