<ion-header>
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button color="secondary" defaultHref="/main/tabs/menu/appetizer"></ion-back-button>
    </ion-buttons>
    <ion-title class="ion-text-center">Delivery Options</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content>
  <ion-grid>
    <ion-row>
      <ion-col size-sm="6" offset-sm="3">
        <ion-button
          type="button"
          color="primary"
          expand="block"
          (click)="addDelivery()"
        >
          Pickup
        </ion-button>
        <ion-button 
        type="button" 
        color="primary"
        expand="block"
        (click)="addDelivery()">
          No Contact Pickup
        </ion-button>
      </ion-col>
    </ion-row>
  </ion-grid>
</ion-content>
