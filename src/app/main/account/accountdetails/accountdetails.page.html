<ion-header>
  <ion-toolbar color="primary">
    <ion-title class="ion-text-center">Account Details</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content>
  <ion-grid>
    <ion-row>
      <ion-col size-sm="6" offset-sm="3">
        <ion-button
          type="button"
          color="danger"
          expand="block"
          (click)="logout()"
        >
          Sign Out
        </ion-button>
      </ion-col>
    </ion-row>
  </ion-grid>

  <ion-segment (ionChange)="onSegmentChange($event)" value="general">
    <ion-segment-button value="general">General</ion-segment-button>
    <ion-segment-button value="order-history">Order History</ion-segment-button>
  </ion-segment>
  <div *ngIf="accountView == 'general'">
    <ion-list *ngFor="let accountDetails of loadedAccountDetails">
      <ion-item >
        <ion-label position="floating">Email</ion-label>
        <ion-input disabled [value]="accountDetails.email"></ion-input>
      </ion-item>
      <ion-item >
        <ion-label position="floating">First Name:</ion-label>
        <ion-input disabled [value]="accountDetails.firstname"></ion-input>
      </ion-item>
      <ion-item >
        <ion-label position="floating">Last Name:</ion-label>
        <ion-input disabled [value]="accountDetails.lastname"></ion-input>
      </ion-item>
    </ion-list>
  </div>
  <div *ngIf="accountView == 'order-history'">
    <ion-card *ngFor="let order of loadedOrders" (click)="onOrderDetailsView(order)">
      <ion-card-subtitle>Order {{ convertOrderId(order.id) }}</ion-card-subtitle>
      <p>Order Total: {{ order.grandTotal }}</p>
    </ion-card>
  </div>
</ion-content>
