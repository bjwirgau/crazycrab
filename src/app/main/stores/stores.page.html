<ion-header>
  <ion-toolbar>
    <ion-title>Stores</ion-title>
    <ion-buttons slot="start">
      <ion-menu-button></ion-menu-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content>
  <ion-grid>
    <ion-row *ngFor="let store of loadedStores">
      <ion-col size="12">
        <app-store [store]="store"></app-store>
      </ion-col>
    </ion-row>
    <ion-row>
      <ion-col size="6" offset="3">
        <ion-button color="success" expand="full" (click)="addStore()">
          Add Store
        </ion-button>
      </ion-col>
    </ion-row>
  </ion-grid>
</ion-content>
